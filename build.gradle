plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extensions {
    loom {
        minecraftVersion = '1.21.4'
        mappings = '1.21.4+build.1'
        modId = 'endupdatemod'
        version = '1.0.0'
        accessWidener = 'src/main/resources/accessWidener.txt'
        remapModResources = true
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.1:v2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.96.0+1.21.4'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand 'fabric.mod.json': [version: project.version, minecraft_version: project.minecraft.version]
    }
    include '**/*.json', '**/*.png', '**/*.xml'
}

loom {
    refreshDeps {
        refresh {
            dependsOn 'build'
        }
    }
    ideaSync {
        runDir = "run"
    }
}
